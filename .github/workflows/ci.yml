name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint repository
        run: python scripts/lint.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check installer dry run
        run: python scripts/install.py --scope project --project-dir /tmp/fresheye-smoke --dry-run
